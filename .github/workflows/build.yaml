name: build
on: [push, pull_request]
env:
  EM_VERSION: 6.0.6
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler:
          - {cc: 'gcc', cxx: 'g++'}
          - {cc: 'clang', cxx: 'clang++'}
        build_type:
          - Debug
          - Release
    name: build with ${{ matrix.compiler.cc }} type ${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -c 'echo "set man-db/auto-update false" | sudo debconf-communicate' && \
          sudo dpkg-reconfigure man-db && \
          sudo apt-get update && \
          sudo apt-get install -y nasm zlib1g-dev
      - uses: libsdl-org/setup-sdl@main
        with:
          version: 3-latest
      - name: Cache 8088 CPU hardware tests
        uses: actions/cache@v6
        with:
          path: .cache/8088-tests
          key: 8088-tests-${{ hashFiles('tools/download-cpu-hardware-tests.sh', 'tools/cpu-hardware-tests-opcodes.txt') }}
          restore-keys: |
            8088-tests-
      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: emsdk-cache
          key: ${{ env.EM_VERSION }}-${{ runner.os }}
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: emsdk-cache
      - run: ${{ matrix.compiler.cc }} --version
      - run: |
          cmake -B ${{github.workspace}}/build-native \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
              -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
      - run: cmake --build ${{github.workspace}}/build-native -j$(nproc)
      - run: tools/run-tests.sh
        env:
          CC: ${{ matrix.compiler.cc }}
      - working-directory: ${{github.workspace}}/build-native/core
        run: ls -lh *.a
      - run: emcmake cmake -B ${{github.workspace}}/build-emscripten
      - run: cmake --build ${{github.workspace}}/build-emscripten -j$(nproc)
      - working-directory: ${{github.workspace}}/build-emscripten/sdl
        run: ls -lh yax86_sdl.*
      - run: git diff --exit-code

  # pico/bench and pico/picocalc, which nothing above builds: they share the
  # core's bundle and generator, and an interface change can break them.
  pico:
    runs-on: ubuntu-latest
    name: build pico/bench and pico/picocalc
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -c 'echo "set man-db/auto-update false" | sudo debconf-communicate' && \
          sudo dpkg-reconfigure man-db && \
          sudo apt-get update && \
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi \
              libstdc++-arm-none-eabi-newlib
      - run: arm-none-eabi-gcc --version
      # The release the Pico builds are measured with, and only the submodule
      # they use.
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
      - run: git -C pico-sdk submodule update --init --depth 1 lib/tinyusb
      - run: pico/bench/build.sh O3
      - run: pico/picocalc/build.sh
      - run: git diff --exit-code
